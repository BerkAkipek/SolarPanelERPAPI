<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar Panel ERP API - Swagger UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://fastapi.tiangolo.com/img/favicon.png" />
  <style>
    /* ==========================================================================
       SOLAR PANEL ERP API - DARK & GLOSSY VIBRANT THEME
       ========================================================================== */
    :root {
      --bg-base: #060911;
      --bg-card: rgba(15, 23, 42, 0.75);
      --bg-card-elevated: rgba(22, 32, 54, 0.85);
      --bg-code: #070b14;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-sheen: rgba(255, 255, 255, 0.22);
      --border-sheen-strong: rgba(255, 255, 255, 0.35);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #38bdf8;
      --accent-cyan-light: #7dd3fc;
      --accent-emerald: #10b981;
      --accent-emerald-light: #34d399;
      --accent-amber: #f59e0b;
      --accent-amber-light: #fbbf24;
      --accent-rose: #f43f5e;
      --accent-rose-light: #fb7185;
      --accent-indigo: #818cf8;
      --accent-purple: #c084fc;
      --accent-fuchsia: #e879f9;
      --glow-cyan: 0 0 24px -4px rgba(56, 189, 248, 0.45);
      --glow-emerald: 0 0 24px -4px rgba(16, 185, 129, 0.45);
      --glow-rose: 0 0 24px -4px rgba(244, 63, 94, 0.45);
      --glow-amber: 0 0 24px -4px rgba(245, 158, 11, 0.45);
      --glass-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.16);
      --glass-shadow-sm: 0 6px 20px -2px rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
    }

    *, *:before, *:after {
      box-sizing: border-box;
    }

    html {
      box-sizing: border-box;
      overflow-y: scroll;
      background-color: var(--bg-base);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #060911;
      background-image: 
        radial-gradient(1000px 500px at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 80%),
        radial-gradient(800px 400px at 85% 15%, rgba(168, 85, 247, 0.08) 0%, transparent 80%),
        radial-gradient(600px 300px at 15% 30%, rgba(16, 185, 129, 0.06) 0%, transparent 80%),
        radial-gradient(900px 600px at 50% 100%, rgba(15, 23, 42, 0.95) 0%, transparent 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }

    /* Custom Glossy Scrollbars */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #060911;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      border-radius: 6px;
      border: 2px solid #060911;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #475569 0%, #334155 100%);
    }

    /* Hide standard Swagger UI topbar */
    .topbar {
      display: none !important;
    }

    /* ==========================================================================
       GLOSSY TOP NAVIGATION BAR
       ========================================================================== */
    .glossy-navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 15, 28, 0.82);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45), inset 0 -1px 0 rgba(255, 255, 255, 0.04);
      padding: 0 24px;
    }

    .navbar-container {
      max-width: 1460px;
      margin: 0 auto;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top: 1px solid var(--border-sheen-strong);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 4px 16px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-info {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 1.18rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-tagline {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .glass-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(20, 29, 48, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 2px 8px rgba(0, 0, 0, 0.25);
      color: var(--text-secondary);
    }

    .glass-pill.status {
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 0 16px -4px rgba(16, 185, 129, 0.3);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse-glow 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .glossy-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #7dd3fc;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.18) 0%, rgba(56, 189, 248, 0.04) 100%), rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 4px 14px rgba(56, 189, 248, 0.2);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glossy-btn:hover {
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.28) 0%, rgba(56, 189, 248, 0.08) 100%), rgba(15, 23, 42, 0.9);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 6px 20px rgba(56, 189, 248, 0.35);
    }

    .glossy-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    /* ==========================================================================
       SWAGGER UI ROOT & GENERAL OVERRIDES
       ========================================================================== */
    .swagger-ui {
      color: var(--text-primary);
      font-family: inherit;
    }

    .swagger-ui .wrapper {
      max-width: 1460px !important;
      padding: 0 24px !important;
      margin: 0 auto !important;
    }

    .swagger-ui a {
      color: var(--accent-cyan) !important;
      text-decoration: none !important;
      transition: all 0.2s ease !important;
    }

    .swagger-ui a:hover {
      color: var(--accent-cyan-light) !important;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5) !important;
    }

    .swagger-ui label {
      color: #cbd5e1 !important;
      font-size: 0.85rem !important;
      font-weight: 500 !important;
    }

    /* SVGs in Swagger UI */
    .swagger-ui svg:not(:root) {
      fill: currentColor;
    }

    .swagger-ui .unlocked,
    .swagger-ui .locked {
      fill: var(--accent-cyan) !important;
    }

    /* ==========================================================================
       INFO HERO SECTION
       ========================================================================== */
    .swagger-ui .info {
      margin: 32px 0 24px 0 !important;
      padding: 38px 44px !important;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 50%, rgba(0, 0, 0, 0.25) 100%), rgba(15, 23, 42, 0.75) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      border: 1px solid var(--border-subtle) !important;
      border-top: 1px solid var(--border-sheen) !important;
      border-radius: 20px !important;
      box-shadow: var(--glass-shadow) !important;
    }

    .swagger-ui .info .title {
      font-size: 2.6rem !important;
      font-weight: 800 !important;
      letter-spacing: -0.03em !important;
      line-height: 1.15 !important;
      background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 70%, #38bdf8 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      margin-bottom: 8px !important;
    }

    .swagger-ui .info .title small {
      background: transparent !important;
      top: 0 !important;
    }

    .swagger-ui .info .title small.version-specs {
      display: inline-block !important;
      margin-left: 12px !important;
    }

    .swagger-ui .info .title small pre {
      display: inline-block !important;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.2) 0%, rgba(56, 189, 248, 0.05) 100%), rgba(15, 23, 42, 0.8) !important;
      border: 1px solid rgba(56, 189, 248, 0.35) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.3) !important;
      color: #7dd3fc !important;
      padding: 4px 10px !important;
      border-radius: 6px !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 0.78rem !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 2px 8px rgba(0, 0, 0, 0.3) !important;
      vertical-align: middle !important;
    }

    .swagger-ui .info .description {
      color: var(--text-secondary) !important;
      font-size: 0.95rem !important;
      line-height: 1.7 !important;
    }

    .swagger-ui .info .description h1,
    .swagger-ui .info .description h2,
    .swagger-ui .info .description h3,
    .swagger-ui .info .description h4 {
      color: #ffffff !important;
      font-weight: 700 !important;
      letter-spacing: -0.01em !important;
      margin-top: 26px !important;
      margin-bottom: 12px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      padding-bottom: 8px !important;
    }

    .swagger-ui .info .description h1 { font-size: 1.6rem !important; }
    .swagger-ui .info .description h2 { font-size: 1.3rem !important; }
    .swagger-ui .info .description h3 { font-size: 1.1rem !important; }

    .swagger-ui .info .description p {
      color: #cbd5e1 !important;
      margin: 10px 0 !important;
    }

    .swagger-ui .info .description ul,
    .swagger-ui .info .description ol {
      color: #cbd5e1 !important;
      padding-left: 24px !important;
      line-height: 1.7 !important;
    }

    .swagger-ui .info .description li {
      margin: 6px 0 !important;
    }

    .swagger-ui .info .description strong {
      color: #ffffff !important;
      font-weight: 600 !important;
    }

    .swagger-ui .info .description hr {
      border: 0 !important;
      height: 1px !important;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent) !important;
      margin: 28px 0 !important;
    }

    .swagger-ui .info .description code {
      background: rgba(7, 11, 20, 0.85) !important;
      border: 1px solid rgba(56, 189, 248, 0.3) !important;
      color: #38bdf8 !important;
      border-radius: 6px !important;
      padding: 2px 7px !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 0.85em !important;
    }

    /* Markdown tables in info description */
    .swagger-ui .info .description table {
      width: 100% !important;
      border-collapse: separate !important;
      border-spacing: 0 !important;
      margin: 20px 0 !important;
      background: rgba(10, 15, 28, 0.6) !important;
      border: 1px solid var(--border-subtle) !important;
      border-top: 1px solid var(--border-sheen) !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
    }

    .swagger-ui .info .description th {
      background: rgba(30, 41, 59, 0.75) !important;
      color: #f1f5f9 !important;
      font-weight: 600 !important;
      font-size: 0.84rem !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      padding: 12px 16px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      text-align: left !important;
    }

    .swagger-ui .info .description td {
      padding: 12px 16px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
      color: var(--text-secondary) !important;
      font-size: 0.9rem !important;
    }

    .swagger-ui .info .description tr:last-child td {
      border-bottom: none !important;
    }

    /* ==========================================================================
       SCHEME CONTAINER / SERVER SELECTOR
       ========================================================================== */
    .swagger-ui .scheme-container {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%), rgba(15, 23, 42, 0.7) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid var(--border-subtle) !important;
      border-top: 1px solid var(--border-sheen) !important;
      border-radius: 14px !important;
      box-shadow: var(--glass-shadow-sm) !important;
      padding: 16px 24px !important;
      margin-bottom: 24px !important;
    }

    .swagger-ui .servers-title {
      color: var(--text-secondary) !important;
      font-size: 0.85rem !important;
      font-weight: 600 !important;
    }

    /* ==========================================================================
       FILTER / SEARCH INPUT BAR
       ========================================================================== */
    .swagger-ui .filter {
      margin: 24px 0 !important;
      padding: 0 !important;
    }

    .swagger-ui .filter .operation-filter-input {
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 14px 22px !important;
      font-size: 0.95rem !important;
      font-family: 'Inter', sans-serif !important;
      color: #ffffff !important;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%), rgba(15, 23, 42, 0.75) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-top: 1px solid var(--border-sheen) !important;
      border-radius: 12px !important;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5), 0 4px 16px rgba(0, 0, 0, 0.2) !important;
      transition: all 0.25s ease !important;
    }

    .swagger-ui .filter .operation-filter-input:focus {
      border-color: rgba(56, 189, 248, 0.6) !important;
      border-top-color: rgba(56, 189, 248, 0.8) !important;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.5) !important;
      outline: none !important;
    }

    .swagger-ui .filter .operation-filter-input::placeholder {
      color: var(--text-muted) !important;
    }

    /* ==========================================================================
       OPERATION TAG SECTIONS
       ========================================================================== */
    .swagger-ui .opblock-tag-section {
      margin-bottom: 24px !important;
    }

    .swagger-ui .opblock-tag {
      display: flex !important;
      align-items: center !important;
      padding: 16px 24px !important;
      margin: 32px 0 16px 0 !important;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(20, 29, 48, 0.75) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid var(--border-subtle) !important;
      border-top: 1px solid var(--border-sheen) !important;
      border-radius: 14px !important;
      box-shadow: var(--glass-shadow-sm) !important;
      cursor: pointer !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .swagger-ui .opblock-tag:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%), rgba(26, 38, 62, 0.85) !important;
      transform: translateY(-1px) !important;
      box-shadow: 0 10px 28px -4px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.22) !important;
    }

    .swagger-ui .opblock-tag a {
      color: #f8fafc !important;
      font-size: 1.35rem !important;
      font-weight: 700 !important;
      letter-spacing: -0.02em !important;
      text-decoration: none !important;
    }

    .swagger-ui .opblock-tag small {
      color: var(--text-secondary) !important;
      font-size: 0.92rem !important;
      margin-left: 14px !important;
      font-weight: 400 !important;
    }

    .swagger-ui .opblock-tag svg {
      fill: var(--text-secondary) !important;
      transition: transform 0.2s ease, fill 0.2s ease !important;
    }

    .swagger-ui .opblock-tag:hover svg {
      fill: var(--accent-cyan) !important;
    }

    /* ==========================================================================
       OPBLOCKS (ENDPOINT CARDS)
       ========================================================================== */
    .swagger-ui .opblock {
      margin: 0 0 16px 0 !important;
      border-radius: 14px !important;
      overflow: hidden !important;
      background: rgba(14, 20, 36, 0.7) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid var(--border-subtle) !important;
      box-shadow: 0 6px 24px -4px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease !important;
    }

    .swagger-ui .opblock:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 14px 34px -6px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.16) !important;
    }

    .swagger-ui .opblock .opblock-summary {
      padding: 12px 18px !important;
      display: flex !important;
      align-items: center !important;
      cursor: pointer !important;
      border-bottom: none !important;
    }

    .swagger-ui .opblock .opblock-summary-method {
      min-width: 90px !important;
      padding: 7px 14px !important;
      border-radius: 8px !important;
      font-size: 0.82rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.06em !important;
      text-align: center !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4) !important;
    }

    .swagger-ui .opblock .opblock-summary-path {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 0.95rem !important;
      font-weight: 600 !important;
      color: #f1f5f9 !important;
      padding: 0 14px !important;
    }

    .swagger-ui .opblock .opblock-summary-path__deprecated {
      text-decoration: line-through !important;
      color: var(--text-muted) !important;
    }

    .swagger-ui .opblock .opblock-summary-description {
      font-size: 0.9rem !important;
      color: var(--text-secondary) !important;
      margin-left: auto !important;
      text-align: right !important;
    }

    .swagger-ui .opblock svg.arrow {
      fill: var(--text-secondary) !important;
      margin-left: 14px !important;
    }

    /* POST - Emerald */
    .swagger-ui .opblock.opblock-post {
      border-color: rgba(16, 185, 129, 0.28) !important;
      border-top-color: rgba(52, 211, 153, 0.5) !important;
    }
    .swagger-ui .opblock.opblock-post .opblock-summary {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.14) 0%, rgba(15, 23, 42, 0.6) 65%) !important;
    }
    .swagger-ui .opblock.opblock-post .opblock-summary-method {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%), #059669 !important;
      border: 1px solid rgba(52, 211, 153, 0.5) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.4) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 2px 10px rgba(16, 185, 129, 0.4) !important;
      color: #ffffff !important;
    }

    /* GET - Sky Cyan */
    .swagger-ui .opblock.opblock-get {
      border-color: rgba(14, 165, 233, 0.28) !important;
      border-top-color: rgba(56, 189, 248, 0.5) !important;
    }
    .swagger-ui .opblock.opblock-get .opblock-summary {
      background: linear-gradient(90deg, rgba(14, 165, 233, 0.14) 0%, rgba(15, 23, 42, 0.6) 65%) !important;
    }
    .swagger-ui .opblock.opblock-get .opblock-summary-method {

{"openapi": "3.1.0", "info": {"title": "Solar Panel ERP API", "description": "\n# Solar Panel ERP API (v1.0.0)\n\nA robust, enterprise-grade REST API for solar panel manufacturing and fulfillment operations.\n\n## Core V1 Business Capabilities\nVersion 1 answers the central operational questions of a solar module plant:\n1. **Given a customer sales order, can we fulfill it directly from warehouse stock?**\n2. **Do we need production to satisfy unfulfilled demand?**\n3. **If production is required, do we have the feasible raw materials in stock to manufacture the missing panels?**\n4. **Can we execute production orders atomically, reserving and consuming raw components and outputting finished modules?**\n\n---\n\n## Architectural Invariants & Domain Principles\n\n- **One Source of Truth**: Physical stock quantities are derived exclusively from immutable, append-only `inventory_movements` and `inventory_movement_lines`. No mutable counter columns exist.\n- **Stock Availability**: `Available = OnHand - ActiveReservations`. Reservable locations are strictly active locations of type `WAREHOUSE`, `BIN`, and `PRODUCTION`. Quarantine (`QUARANTINE`), damaged (`DAMAGED`), and transit (`TRANSIT`) locations are never promised to sales orders or production feasibility.\n- **Option A Traceability**: Component reservations belong directly to production order material lines (`production_order_material_id`), preserving end-to-end genealogy.\n- **Explicit Workflows**:\n  - Sales Orders: `DRAFT` ➔ `CONFIRMED` ➔ `CANCELLED`\n  - Stock Reservations: `ACTIVE` ➔ `RELEASED` or `CONSUMED`\n  - Production Orders: `DRAFT` ➔ `RELEASED` ➔ `IN_PROGRESS` ➔ `COMPLETED` (or `CANCELLED`)\n- **Atomic Execution**: Completing a production order executes four interrelated domain events in a single PostgreSQL transaction: consumes reservations, posts raw material consumption movements, posts finished goods output movements, and marks the order `COMPLETED`. Any failure triggers an automatic full rollback. alidation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}, "get": {"tags": ["Product definition"], "summary": "List item revisions", "description": "Lists all revisions belonging to the specified item.", "operationId": "list_revisions_items__item_id__revisions_get", "parameters": [{"name": "item_id", "in": "path", "required": true, "schema": {"type": "integer", "maximum": 9223372036854775807, "exclusiveMinimum": 0, "title": "Item Id"}}, {"name": "x-organization-id", "in": "header", "required": true, "schema": {"type": "integer", "maximum": 9223372036854775807, "exclusiveMinimum": 0, "title": "X-Organization-Id"}}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/RevisionRead"}, "title": "Response List Revisions Items  Item Id  Revisions Get"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/boms": {"post": {"tags": ["Product definition"], "summary": "Create Bill of Materials (recipe)", "description": "Creates a new Bill of Materials recipe for a finished-good product revision.\n\n- Starts in DRAFT status.\n- Database trigger enforces that recipes start in DRAFT and cannot be activated without component lines.", "operationId": "create_bom_boms_post", "parameters": [{"name": "x-organization-id", "in": "header", "required": true, "schema": {"type": "integer", "maximum": 9223372036854775807, "exclusiveMinimum": 0, "title": "X-Organization-Id"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BOMCreate"}}}}, "responses": {"201": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BOMRead"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema":     window.onload = function() {
      var specElement = document.getElementById('openapi-spec');
      var specObj = JSON.parse(specElement.textContent);
      
      const ui = SwaggerUIBundle({
        spec: specObj,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout",
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: "list",
        filter: true,
        showExtensions: true,
        showCommonExtensions: true
      });
      window.ui = ui;

      // Spec download handler
      var dlBtn = document.getElementById('btn-download-spec');
      if (dlBtn) {
        dlBtn.addEventListener('click', function() {
          var blob = new Blob([JSON.stringify(specObj, null, 2)], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'openapi.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      }
    };
  </script>
</body>
</html>
